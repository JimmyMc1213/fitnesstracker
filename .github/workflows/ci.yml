name: CI

on:
  push:
    branches: [main, monorepo]
  pull_request:
    branches: [main, monorepo]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npx turbo run typecheck build
        env:
          VITE_SUPABASE_URL: ""
          VITE_SUPABASE_PUBLISHABLE_KEY: ""

      - name: Unit tests
        run: npx turbo run test --filter=@newyouai/pwa

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/pwa
        env:
          PLAYWRIGHT_BROWSERS_PATH: ../../.playwright-browsers

      - name: E2E tests
        run: npm run test:e2e --workspace=@newyouai/pwa
        env:
          PLAYWRIGHT_BROWSERS_PATH: .playwright-browsers
