name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx turbo run typecheck
        env:
          VITE_SUPABASE_URL: ""
          VITE_SUPABASE_PUBLISHABLE_KEY: ""
          EXPO_PUBLIC_SUPABASE_URL: ""
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ""

      # Explicit gate — @newyouai/mobile included in monorepo typecheck above (RN-0-05)
      - name: Mobile typecheck
        run: npx turbo run typecheck --filter=@newyouai/mobile
        env:
          EXPO_PUBLIC_SUPABASE_URL: ""
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ""

      - name: Build
        run: npx turbo run build
        env:
          VITE_SUPABASE_URL: ""
          VITE_SUPABASE_PUBLISHABLE_KEY: ""
          EXPO_PUBLIC_SUPABASE_URL: ""
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ""

      - name: Unit tests
        run: npx turbo run test --filter=@newyouai/pwa

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/pwa
        env:
          PLAYWRIGHT_BROWSERS_PATH: ../../.playwright-browsers

      - name: E2E tests
        run: npm run test:e2e --workspace=@newyouai/pwa
        env:
          PLAYWRIGHT_BROWSERS_PATH: .playwright-browsers
