# One-off QA pass — sign up and land on Home (skip onboarding via Metro env).
appId: app.newyouai.mobile
env:
  TEST_NAME: ${MAESTRO_TEST_SIGNUP_NAME}
  TEST_EMAIL: ${MAESTRO_TEST_SIGNUP_EMAIL}
  TEST_PASSWORD: ${MAESTRO_TEST_SIGNUP_PASSWORD}
---
- launchApp:
    clearState: true
    clearKeychain: true
- openLink: exp+newyouai-mobile://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8082
- runFlow: ../../apps/mobile/.maestro/subflows/dev-client-connect.yaml
- extendedWaitUntil:
    visible:
      id: auth-welcome-screen
    timeout: 60000
- tapOn:
    id: auth-get-started-button
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: auth-continue-sign-up
- extendedWaitUntil:
    visible:
      id: auth-sign-up-title
    timeout: 15000
- tapOn:
    text: "Name"
- eraseText
- inputText: ${TEST_NAME}
- tapOn:
    text: "Email"
- eraseText
- inputText: ${TEST_EMAIL}
- tapOn:
    text: "Password"
- eraseText
- inputText: ${TEST_PASSWORD}
- tapOn:
    id: auth-sign-up-submit
- extendedWaitUntil:
    visible:
      id: tab-home
    timeout: 60000
- assertVisible:
    id: home-title
