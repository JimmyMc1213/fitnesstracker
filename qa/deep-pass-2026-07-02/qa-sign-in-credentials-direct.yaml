# Direct testID sign-in — use with auth-sign-in-credentials.yaml when possible.
appId: app.newyouai.mobile
---
- tapOn:
    id: auth-sign-in-email
- eraseText
- inputText: ${TEST_EMAIL}
- tapOn:
    id: auth-sign-in-password
- eraseText
- inputText: ${TEST_PASSWORD}
- tapOn:
    id: auth-sign-in-title
- tapOn:
    id: auth-sign-in-submit
- extendedWaitUntil:
    notVisible:
      id: auth-sign-in-screen
    timeout: 90000
