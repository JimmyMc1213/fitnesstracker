<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>New You AI password reset</title>
  </head>
  <body style="margin: 0; padding: 24px; background: #0a0a0a; color: #f5f5f5; font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">
    <div style="max-width: 480px; margin: 0 auto;">
      <p style="margin: 0 0 16px; font-size: 16px; line-height: 1.6;">
        Use the button below to choose a new password for <strong>{{ .Email }}</strong>.
      </p>
      <p style="margin: 0 0 24px; font-size: 14px; line-height: 1.6; color: rgba(255, 255, 255, 0.72);">
        If you requested another reset, this message continues the same email thread. Always use the
        latest link below.
      </p>
      <p style="margin: 0 0 24px;">
        <a
          href="{{ .ConfirmationURL }}"
          style="display: inline-block; padding: 12px 20px; border-radius: 999px; background: #c9a876; color: #14110c; font-weight: 700; text-decoration: none;"
        >
          Reset password
        </a>
      </p>
      <p style="margin: 0; font-size: 12px; line-height: 1.6; color: rgba(255, 255, 255, 0.55);">
        If you did not request this, you can ignore this email.
      </p>
    </div>
  </body>
</html>
