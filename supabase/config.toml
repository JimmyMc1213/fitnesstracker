# Supabase project config (linked: ztedlrvvkcjxoomwavyd / fitnesstracker)
# Push auth changes: supabase config push --yes
# WARNING: Unspecified [auth] fields fall back to CLI defaults — keep this section complete.

[auth]
enabled = true
site_url = "https://app.newyouai.app"
additional_redirect_urls = [
  "http://localhost:5173/",
  "https://app.newyouai.app/**",
  "newyouai://auth/callback",
  "exp://127.0.0.1:8081/--/auth/callback",
  "exp://127.0.0.1:8082/--/auth/callback",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 6

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false
max_frequency = "1m0s"
otp_length = 8
otp_expiry = 3600

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false

# Edge Function deploy settings
[functions.food-search]
verify_jwt = true

[functions.delete-user]
verify_jwt = true

[functions.future-you-upload]
verify_jwt = true

[functions.future-you-generate]
verify_jwt = true

[functions.future-you-status]
verify_jwt = true

[functions.future-you-report]
verify_jwt = true

[functions.future-you-delete]
verify_jwt = true

[functions.issue-report]
verify_jwt = true

# Inbound RevenueCat webhook: authenticated by REVENUECAT_WEBHOOK_AUTH header, not a user JWT.
[functions.revenuecat-webhook]
verify_jwt = false
