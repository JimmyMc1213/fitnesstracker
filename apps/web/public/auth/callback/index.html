<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Opening New You</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #0a0a0a;
        color: #f5f5f5;
        text-align: center;
      }
      a {
        display: inline-block;
        margin-top: 20px;
        padding: 12px 20px;
        border-radius: 999px;
        background: #c9a876;
        color: #14110c;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main style="max-width: 420px">
      <h1 id="title" style="margin: 0 0 12px; font-size: 1.5rem">Opening New You…</h1>
      <p id="status" style="margin: 0; line-height: 1.6; color: rgba(255, 255, 255, 0.72)">
        Sending you back to the app.
      </p>
      <a id="open-app" href="#" hidden>Open New You</a>
    </main>
    <script>
      (function () {
        var APP_SCHEME = "newyouai://auth/callback";
        var hash = window.location.hash || "";
        var search = window.location.search || "";
        var params = new URLSearchParams(hash.replace(/^#/, ""));
        var code = params.get("error_code") || params.get("error") || "";
        var description = (params.get("error_description") || "").replace(/\+/g, " ");
        var title = document.getElementById("title");
        var status = document.getElementById("status");
        var openLink = document.getElementById("open-app");

        if (code === "otp_expired" || description.toLowerCase().indexOf("expired") !== -1) {
          if (title) title.textContent = "This reset link expired";
          if (status) {
            status.textContent =
              "Request a new password reset from the New You app sign-in screen and use the latest email.";
          }
          return;
        }

        if (params.get("error")) {
          if (title) title.textContent = "Could not finish sign-in";
          if (status) status.textContent = description || "This link is no longer valid.";
          return;
        }

        var target = APP_SCHEME + search + hash;
        if (openLink) {
          openLink.href = target;
          openLink.hidden = false;
        }

        if (hash.indexOf("access_token") !== -1 || hash.indexOf("refresh_token") !== -1 || search.indexOf("code=") !== -1) {
          window.location.replace(target);
          window.setTimeout(function () {
            if (status) {
              status.textContent =
                "If New You did not open automatically, tap Open New You to continue in the app.";
            }
          }, 1800);
          return;
        }

        if (status) {
          status.textContent = "This link is only used to finish sign-in or password reset in the New You app.";
        }
      })();
    </script>
  </body>
</html>
