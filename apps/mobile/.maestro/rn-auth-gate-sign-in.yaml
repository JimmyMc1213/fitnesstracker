# RN-2-01 auth gate sign-in — requires Supabase + test account
# Run: MAESTRO_TEST_EMAIL=... MAESTRO_TEST_PASSWORD=... maestro test .maestro/rn-auth-gate-sign-in.yaml
appId: app.newyouai.mobile
env:
  TEST_EMAIL: ${MAESTRO_TEST_EMAIL}
  TEST_PASSWORD: ${MAESTRO_TEST_PASSWORD}
---
- launchApp:
    clearState: true
    clearKeychain: true
- openLink: exp+newyouai-mobile://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8082
- runFlow: subflows/dev-client-connect.yaml
- extendedWaitUntil:
    visible:
      id: auth-welcome-headline
    timeout: 60000
- tapOn:
    id: auth-sign-in-link
- runFlow: subflows/auth-sign-in-credentials.yaml
- extendedWaitUntil:
    visible:
      id: tab-home
    timeout: 45000
- assertVisible:
    id: home-title
