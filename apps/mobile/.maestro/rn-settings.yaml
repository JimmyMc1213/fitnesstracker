# RN-10-06 settings hub smoke — requires Supabase + onboarded seed + Metro on :8082
# Run: EXPO_PUBLIC_E2E_FITNESS_SEED=coach-nutrition MAESTRO_TEST_EMAIL=... MAESTRO_TEST_PASSWORD=... npm run test:e2e:settings
# Metro: cd apps/mobile && EXPO_PUBLIC_E2E_FITNESS_SEED=coach-nutrition npx expo start --dev-client --port 8082
appId: app.newyouai.mobile
env:
  TEST_EMAIL: ${MAESTRO_TEST_EMAIL}
  TEST_PASSWORD: ${MAESTRO_TEST_PASSWORD}
---
- launchApp:
    clearState: true
    clearKeychain: true
- openLink: exp+newyouai-mobile://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8082
- runFlow: subflows/dev-client-connect.yaml
- extendedWaitUntil:
    visible:
      id: auth-welcome-headline
    timeout: 60000
- runFlow: subflows/auth-sign-in-credentials.yaml
- extendedWaitUntil:
    visible:
      id: tab-home
    timeout: 45000
- runFlow: subflows/open-settings-hub.yaml
- tapOn:
    id: settings-row-fuel-targets
- extendedWaitUntil:
    visible:
      id: settings-panel-fuel-targets
    timeout: 10000
- tapOn:
    id: settings-panel-back
- extendedWaitUntil:
    visible:
      id: settings-hub
    timeout: 10000
- tapOn:
    id: settings-row-account
- extendedWaitUntil:
    visible:
      id: settings-panel-account
    timeout: 10000
