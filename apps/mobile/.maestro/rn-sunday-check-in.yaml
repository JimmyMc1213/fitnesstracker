# RN-8-07 Sunday check-in smoke, Home card → modal → lock in → completed card
# Run: EXPO_PUBLIC_E2E_FITNESS_SEED=progress EXPO_PUBLIC_E2E_DEV_PREVIEW_SUNDAY=true MAESTRO_TEST_EMAIL=... MAESTRO_TEST_PASSWORD=... npm run test:e2e:sunday-check-in
# Metro:
#   cd apps/mobile && EXPO_PUBLIC_E2E_FITNESS_SEED=progress EXPO_PUBLIC_E2E_DEV_PREVIEW_SUNDAY=true npx expo start --dev-client --port 8082
#
# Stable testIDs: sunday-check-in-card, modal-sunday-check-in, sunday-check-in-step-*,
# sunday-check-in-continue, sunday-commitment-stack-sessions
appId: app.newyouai.mobile
env:
  TEST_EMAIL: ${MAESTRO_TEST_EMAIL}
  TEST_PASSWORD: ${MAESTRO_TEST_PASSWORD}
---
- launchApp:
    clearState: true
    clearKeychain: true
- openLink: exp+newyouai-mobile://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8082
- runFlow: subflows/dev-client-connect.yaml
- extendedWaitUntil:
    visible:
      id: auth-welcome-screen
    timeout: 60000
- runFlow: subflows/auth-sign-in-credentials.yaml
- extendedWaitUntil:
    visible:
      id: tab-home
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: sunday-check-in-card
    timeout: 15000
- tapOn:
    id: sunday-check-in-card
- extendedWaitUntil:
    visible:
      id: modal-sunday-check-in
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: sunday-check-in-step-0
    timeout: 5000
- tapOn:
    id: sunday-check-in-continue
- extendedWaitUntil:
    visible:
      id: sunday-check-in-step-1
    timeout: 5000
- tapOn:
    id: sunday-check-in-continue
- extendedWaitUntil:
    visible:
      id: sunday-check-in-step-2
    timeout: 5000
- tapOn:
    id: sunday-check-in-continue
- extendedWaitUntil:
    visible:
      id: sunday-check-in-step-3
    timeout: 5000
- tapOn:
    id: sunday-commitment-stack-sessions
- tapOn:
    id: sunday-check-in-continue
- extendedWaitUntil:
    visible:
      id: sunday-check-in-locked
    timeout: 5000
- tapOn:
    id: sunday-check-in-continue
- extendedWaitUntil:
    visible:
      id: tab-home
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: sunday-check-in-card
    timeout: 10000
- assertVisible:
    text: "Done"
