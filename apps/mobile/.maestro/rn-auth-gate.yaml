# RN-2-01 auth gate, requires Supabase env in dev client build
# Run from apps/mobile with EXPO_PUBLIC_SUPABASE_* set (see .env.example)
# Optional sign-in: MAESTRO_TEST_EMAIL + MAESTRO_TEST_PASSWORD env vars
appId: app.newyouai.mobile
---
- launchApp:
    clearState: true
    clearKeychain: true
- openLink: exp+newyouai-mobile://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8082
- runFlow: subflows/dev-client-connect.yaml
- extendedWaitUntil:
    visible:
      id: auth-welcome-screen
    timeout: 60000
- assertNotVisible:
    id: home-title
- runFlow: subflows/auth-enter-from-welcome.yaml
- tapOn:
    id: auth-sign-in-link
- assertVisible:
    id: auth-sign-in-title
- assertVisible:
    id: auth-sign-in-email
- tapOn:
    id: auth-sign-in-back
- tapOn:
    id: auth-continue-sign-up
- assertVisible:
    id: auth-sign-up-title
- assertVisible:
    id: auth-sign-up-email
