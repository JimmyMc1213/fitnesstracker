# RN-2-02 email sign-up, requires Supabase + disposable test account + Metro on :8082
# Metro: cd apps/mobile && EXPO_PUBLIC_MAESTRO_E2E_AUTH=true npx expo start --dev-client --port 8082
# Run: MAESTRO_TEST_SIGNUP_FIRST_NAME=... MAESTRO_TEST_SIGNUP_LAST_NAME=... MAESTRO_TEST_SIGNUP_EMAIL=... MAESTRO_TEST_SIGNUP_PASSWORD=... \
#      maestro test .maestro/rn-auth-sign-up.yaml
appId: app.newyouai.mobile
env:
  TEST_FIRST_NAME: ${MAESTRO_TEST_SIGNUP_FIRST_NAME}
  TEST_LAST_NAME: ${MAESTRO_TEST_SIGNUP_LAST_NAME}
  TEST_EMAIL: ${MAESTRO_TEST_SIGNUP_EMAIL}
  TEST_PASSWORD: ${MAESTRO_TEST_SIGNUP_PASSWORD}
---
- launchApp:
    clearState: true
    clearKeychain: true
- openLink: exp+newyouai-mobile://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8082
- runFlow: subflows/dev-client-connect.yaml
- extendedWaitUntil:
    visible:
      id: auth-welcome-screen
    timeout: 60000
- runFlow: subflows/auth-sign-up-credentials.yaml
- extendedWaitUntil:
    visible:
      id: tab-home
    timeout: 45000
- assertVisible:
    id: home-title
