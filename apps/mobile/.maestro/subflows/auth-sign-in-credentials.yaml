# Shared sign-in: welcome → credentials → submit (iOS TextInput uses accessibility labels).
appId: app.newyouai.mobile
---
- runFlow:
    when:
      visible:
        id: auth-welcome-headline
    commands:
      - scrollUntilVisible:
          element:
            id: auth-sign-in-link
          direction: DOWN
          timeout: 10000
          optional: true
      - tapOn:
          id: auth-sign-in-link
      - waitForAnimationToEnd:
          timeout: 5000
- extendedWaitUntil:
    visible:
      id: auth-sign-in-screen
    timeout: 45000
- tapOn:
    text: "Email"
- eraseText
- inputText: ${TEST_EMAIL}
- tapOn:
    text: "Password"
- eraseText
- inputText: ${TEST_PASSWORD}
- tapOn:
    id: auth-sign-in-title
- tapOn:
    id: auth-sign-in-email
- tapOn:
    id: auth-sign-in-password
- tapOn:
    id: auth-sign-in-submit
- extendedWaitUntil:
    notVisible:
      id: auth-sign-in-screen
    timeout: 45000
- runFlow: dismiss-ios-password-prompt.yaml
