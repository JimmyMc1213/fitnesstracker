# Shared sign-in: welcome → credentials → submit.
appId: app.newyouai.mobile
---
- runFlow: auth-enter-from-welcome.yaml
- runFlow:
    when:
      visible:
        id: auth-sign-in-link
    commands:
      - scrollUntilVisible:
          element:
            id: auth-sign-in-link
          direction: DOWN
          timeout: 15000
      - tapOn:
          id: auth-sign-in-link
          retryTapIfNoChange: true
      - waitForAnimationToEnd:
          timeout: 3000
      - runFlow:
          when:
            visible:
              id: auth-sign-in-link
          commands:
            - openLink: exp+newyouai-mobile://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8082%2F--%2F(auth)%2Fsign-in
            - waitForAnimationToEnd:
                timeout: 8000
- extendedWaitUntil:
    visible:
      id: auth-sign-in-title
    timeout: 45000
- tapOn:
    id: auth-sign-in-email
- eraseText
- inputText: ${TEST_EMAIL}
- tapOn:
    id: auth-sign-in-password
- eraseText
- inputText: ${TEST_PASSWORD}
- tapOn:
    id: auth-sign-in-title
- tapOn:
    id: auth-sign-in-submit
- extendedWaitUntil:
    notVisible:
      id: auth-sign-in-screen
    timeout: 45000
- runFlow: dismiss-ios-password-prompt.yaml
