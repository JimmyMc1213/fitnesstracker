# Shared steps after openLink — wait for Metro bundle, dismiss Expo dev client intro, recover from errors.
appId: app.newyouai.mobile
---
# Poll until auth welcome is reachable (Continue modal blocks headline until dismissed)
- repeat:
    times: 40
    while:
      notVisible:
        id: auth-welcome-headline
    commands:
      - tapOn:
          text: Continue
          optional: true
      - tapOn:
          text: Dismiss
          optional: true
      - tapOn:
          text: Reload
          optional: true
