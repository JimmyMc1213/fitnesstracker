# Shared sign-up: welcome → credentials → submit.
appId: app.newyouai.mobile
---
- runFlow: auth-enter-from-welcome.yaml
- tapOn:
    id: auth-continue-sign-up
- extendedWaitUntil:
    visible:
      id: auth-sign-up-title
    timeout: 15000
- tapOn:
    id: auth-sign-up-first-name
- eraseText
- inputText: ${TEST_FIRST_NAME}
- tapOn:
    id: auth-sign-up-last-name
- eraseText
- inputText: ${TEST_LAST_NAME}
- tapOn:
    id: auth-sign-up-email
- eraseText
- inputText: ${TEST_EMAIL}
- tapOn:
    id: auth-sign-up-password
- eraseText
- inputText: ${TEST_PASSWORD}
- tapOn:
    id: auth-sign-up-title
- tapOn:
    id: auth-sign-up-submit
- extendedWaitUntil:
    notVisible:
      id: auth-sign-up-screen
    timeout: 45000
- runFlow: dismiss-ios-password-prompt.yaml
