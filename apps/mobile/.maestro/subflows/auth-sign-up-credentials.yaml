# Shared sign-up: welcome → credentials → submit (mirrors auth-sign-in-credentials).
appId: app.newyouai.mobile
---
- tapOn:
    id: auth-get-started-button
- extendedWaitUntil:
    visible:
      id: auth-sign-up-title
    timeout: 15000
- tapOn:
    text: "Name"
- eraseText
- inputText: ${TEST_NAME}
- tapOn:
    text: "Email"
- eraseText
- inputText: ${TEST_EMAIL}
- tapOn:
    text: "Password"
- eraseText
- inputText: ${TEST_PASSWORD}
- tapOn:
    id: auth-sign-up-title
- tapOn:
    id: auth-sign-up-name
- tapOn:
    id: auth-sign-up-email
- tapOn:
    id: auth-sign-up-password
- tapOn:
    id: auth-sign-up-submit
- extendedWaitUntil:
    notVisible:
      id: auth-sign-up-screen
    timeout: 45000
- runFlow: dismiss-ios-password-prompt.yaml
