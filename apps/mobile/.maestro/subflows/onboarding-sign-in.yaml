appId: app.newyouai.mobile
---
- extendedWaitUntil:
    visible:
      id: auth-welcome-headline
    timeout: 60000
- tapOn:
    id: auth-sign-in-link
- tapOn:
    id: auth-sign-in-email
- eraseText
- inputText: ${TEST_EMAIL}
- tapOn:
    id: auth-sign-in-password
- eraseText
- inputText: ${TEST_PASSWORD}
- tapOn:
    id: auth-sign-in-submit
- runFlow: subflows/dismiss-ios-password-prompt.yaml
- extendedWaitUntil:
    visible:
      id: onboarding-wizard
    timeout: 45000
