# RN-2-05 sign-out — requires Supabase + test account
# Run: MAESTRO_TEST_EMAIL=... MAESTRO_TEST_PASSWORD=... maestro test .maestro/rn-auth-sign-out.yaml
appId: app.newyouai.mobile
env:
  TEST_EMAIL: ${MAESTRO_TEST_EMAIL}
  TEST_PASSWORD: ${MAESTRO_TEST_PASSWORD}
---
- launchApp:
    clearState: true
    clearKeychain: true
- openLink: exp+newyouai-mobile://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8082
- runFlow: subflows/dev-client-connect.yaml
- extendedWaitUntil:
    visible:
      id: auth-welcome-headline
    timeout: 60000
- tapOn:
    id: auth-sign-in-link
- tapOn:
    id: auth-sign-in-email
- eraseText
- inputText: ${TEST_EMAIL}
- tapOn:
    id: auth-sign-in-password
- eraseText
- inputText: ${TEST_PASSWORD}
- tapOn:
    id: auth-sign-in-title
- tapOn:
    id: auth-sign-in-submit
- runFlow: subflows/dismiss-ios-password-prompt.yaml
- extendedWaitUntil:
    visible:
      id: home-title
    timeout: 30000
- tapOn:
    id: home-sign-out
- extendedWaitUntil:
    visible:
      id: auth-welcome-headline
    timeout: 30000
- assertNotVisible:
    id: home-title
