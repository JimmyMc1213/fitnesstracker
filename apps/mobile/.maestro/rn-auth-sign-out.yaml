# RN-2-05 sign-out, requires Supabase + test account
# Run: MAESTRO_TEST_EMAIL=... MAESTRO_TEST_PASSWORD=... maestro test .maestro/rn-auth-sign-out.yaml
appId: app.newyouai.mobile
env:
  TEST_EMAIL: ${MAESTRO_TEST_EMAIL}
  TEST_PASSWORD: ${MAESTRO_TEST_PASSWORD}
---
- launchApp:
    clearState: true
    clearKeychain: true
- openLink: exp+newyouai-mobile://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8082
- runFlow: subflows/dev-client-connect.yaml
- extendedWaitUntil:
    visible:
      id: auth-welcome-screen
    timeout: 60000
- runFlow: subflows/auth-sign-in-credentials.yaml
- extendedWaitUntil:
    visible:
      id: tab-home
    timeout: 45000
- assertVisible:
    id: home-title
- runFlow: subflows/open-settings-hub.yaml
- tapOn:
    id: settings-profile-card
- extendedWaitUntil:
    visible:
      id: settings-panel-you
    timeout: 10000
- scrollUntilVisible:
    element:
      id: settings-sign-out
    direction: DOWN
    timeout: 15000
- tapOn:
    id: settings-sign-out
- extendedWaitUntil:
    visible:
      id: settings-sign-out-confirm
    timeout: 10000
- tapOn:
    id: settings-sign-out-confirm
- extendedWaitUntil:
    visible:
      id: auth-welcome-screen
    timeout: 30000
- assertNotVisible:
    id: home-title
