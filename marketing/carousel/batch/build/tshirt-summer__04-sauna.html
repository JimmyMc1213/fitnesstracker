<!doctype html><html><head><meta charset="utf-8"><style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; }
  .stage {
    position: relative;
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
  }
  .bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center center;
    display: block;
  }
  .copy {
    position: absolute;
    left: 50%;
    top: 44%;
    transform: translate(-50%, -50%);
    width: 88%;
    text-align: center;
    z-index: 2;
  }
  .headline {
    color: #fff;
    font-size: 58px;
    font-weight: 700;
    line-height: 1.15;
    letter-spacing: -0.01em;
    text-shadow: 
  -2px -2px 0 #000,
  2px -2px 0 #000,
  -2px 2px 0 #000,
  2px 2px 0 #000,
  0 0 6px rgba(0,0,0,0.85)
;
  }
  .subline {
    margin-top: 14px;
    color: #fff;
    font-size: 50px;
    font-weight: 700;
    line-height: 1.15;
    letter-spacing: -0.01em;
    text-shadow: 
  -2px -2px 0 #000,
  2px -2px 0 #000,
  -2px 2px 0 #000,
  2px 2px 0 #000,
  0 0 6px rgba(0,0,0,0.85)
;
  }
  .badge {
    position: absolute;
    right: 7%;
    bottom: 16%;
    color: #fff;
    font-size: 46px;
    font-weight: 700;
    line-height: 1.1;
    text-shadow: 
  -2px -2px 0 #000,
  2px -2px 0 #000,
  -2px 2px 0 #000,
  2px 2px 0 #000,
  0 0 6px rgba(0,0,0,0.85)
;
    z-index: 2;
    text-align: right;
  }
  </style></head><body>
  <div class="stage">
    <img class="bg" src="../assets/sauna-02.jpg" alt="">
    <div class="copy">
      <div class="headline">3. Sleep more</div>
      <div class="subline">Rest, Sauna, and Sleep</div>
    </div>
    
  </div>
  </body></html>
